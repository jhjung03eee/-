[project]
name = "kia-bid-screener"
version = "0.1.0"
description = "KIA 공공입찰 공고 자동 스크리너"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.8",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "openai>=1.30",
    "jinja2>=3.1",
    "python-dateutil>=2.9",
    "rich>=13.7",
    "loguru>=0.7",
    "fastapi>=0.109",
    "uvicorn>=0.27",
    "python-multipart>=0.0.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.typer]
pretty-exceptions-enable = false